name: Package Windows EXE

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish packaged .exe files to a GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer & Portable EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build and package Windows .exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run electron:build

      - name: Verify .exe output and generate checksums
        run: node scripts/verify-artifacts.mjs

      - name: Upload Windows .exe Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lunex-Windows-x64-EXE
          path: |
            release/*/*.exe
            !release/*/*uninstaller*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (on version tag or manual dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs
